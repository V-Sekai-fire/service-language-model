[workspace]
name = "bonsai-v2-auto"
version = "0.5.0"
description = "Zero-argument single-step launcher for Ternary-Bonsai-2-27B with DFlash2"
channels = ["conda-forge", "nvidia"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = "3.11.*"
git = "*"
huggingface_hub = ">=0.28"
zstd = ">=1.5.7,<2"

[target.win-64.dependencies]
cuda-toolkit = ">=12.4"
go = ">=1.25"

[target.linux-64.dependencies]
cuda-toolkit = ">=12.4"

[tasks]
default = { depends-on = ["serve"] }

benchmark = { cmd = "python benchmark.py", description = "Benchmark a running `pixi run serve` instance (prefill and generation tokens/s)" }
tray-build = { cmd = "cmake -S tray -B tray/build && cmake --build tray/build --config Release", description = "Build the native language-model tray, offline installer, and payload-volume packer (MSVC)" }
tray = { depends-on = ["tray-build"], cmd = "tray/build/Release/language-model-tray.exe", description = "Start the installed local language-model server from the tray" }
installer-build = { cmd = "cmake -S tray -B tray/build && cmake --build tray/build --target language-model-install --config Release", description = "Build the macOS release asset installer" }

dl-target = "hf download OS-Software/Ternary-Bonsai-2-27B-Uncensored-Heretic-v2-GGUF Ternary-Bonsai-2-27B-Uncensored-Heretic-v2-PQ2_0.gguf --local-dir ./models"
dl-draft = "hf download incoai/Qwen3.8-27B-DFlash2-GGUF Qwen3.8-27B-DFlash2-Q4_K_M.gguf --local-dir ./models"
pack = "python pack.py"
unpack = "python pack.py -d"


[target.win-64.tasks]
dl-prism = { cmd = '''python -c "
import os, urllib.request, zipfile
target = 'llama-prism/llama-server.exe'
if not os.path.exists(target):
    print('Fetching Prism CUDA 13.3 binary and runtime DLLs...')
    urls = [
        'https://github.com/PrismML-Eng/llama.cpp/releases/download/prism-b10754-2459f68/llama-prism-b10754-2459f68-bin-win-cuda-13.3-x64.zip',
        'https://github.com/PrismML-Eng/llama.cpp/releases/download/prism-b10754-2459f68/cudart-llama-bin-win-cuda-13.3-x64.zip'
    ]
    os.makedirs('llama-prism', exist_ok=True)
    for idx, url in enumerate(urls):
        zpath = f'prism_temp_{idx}.zip'
        urllib.request.urlretrieve(url, zpath)
        with zipfile.ZipFile(zpath, 'r') as z:
            for item in z.infolist():
                fname = os.path.basename(item.filename)
                if fname:
                    open(os.path.join('llama-prism', fname), 'wb').write(z.open(item).read())
        if os.path.exists(zpath): os.remove(zpath)
    print('Extracted Prism binary and CUDA runtime DLLs successfully.')
"''' }

serve = { depends-on = ["dl-target", "dl-draft", "dl-prism"], cmd = '''python -c "
import os, secrets, subprocess, sys
os.makedirs('llama-slots', exist_ok=True)
env_file = '.env'
key = None
if os.path.exists(env_file):
    with open(env_file, 'r') as f:
        for line in f:
            if line.strip().startswith('LLAMA_API_KEY='):
                key = line.strip().split('=', 1)[1].strip(' ' + chr(34) + chr(39))
                break
if not key:
    key = secrets.token_hex(16)
    with open(env_file, 'a') as f:
        f.write(f'LLAMA_API_KEY={key}\n')
    print('Generated new LLAMA_API_KEY in .env')
else:
    print('Loaded LLAMA_API_KEY from .env')

cmd = [r'.\llama-prism\llama-server.exe', '-m', r'.\models\Ternary-Bonsai-2-27B-Uncensored-Heretic-v2-PQ2_0.gguf', '-md', r'.\models\Qwen3.8-27B-DFlash2-Q4_K_M.gguf', '--spec-type', 'draft-dflash', '--spec-draft-n-max', '7', '--reasoning-preserve', '--slot-save-path', r'.\llama-slots', '--cors-origins', '*', '--api-key', key, '-ngl', '99', '-ngld', '99', '-sm', 'layer', '-c', '262144', '-b', '4096', '-ub', '1024', '-ctk', 'q8_0', '-ctv', 'q8_0', '-t', '8', '-np', '4', '-fa', 'on', '--no-repack', '--repeat-penalty', '1.0', '--temp', '0.65', '--host', '0.0.0.0', '--port', '9931']
sys.exit(subprocess.call(cmd))
"''', env = { CUDA_VISIBLE_DEVICES = "0,1" } }

[target.linux-64.tasks]
dl-prism = { cmd = '''python -c "
import json, os, urllib.request, tarfile, zipfile, shutil
tag = 'prism-b10754-2459f68'
target = 'llama-prism/llama-server'
if not os.path.exists(target):
    print(f'Fetching prebuilt Prism Linux binary ({tag})...')
    req = urllib.request.Request(f'https://api.github.com/repos/PrismML-Eng/llama.cpp/releases/tags/{tag}', headers={'User-Agent': 'Mozilla/5.0'})
    url = None
    try:
        assets = json.loads(urllib.request.urlopen(req).read().decode()).get('assets', [])
        url = next(a['browser_download_url'] for a in assets if any(k in a['name'].lower() for k in ['ubuntu', 'linux']))
    except Exception:
        url = f'https://github.com/PrismML-Eng/llama.cpp/releases/download/{tag}/llama-prism-{tag}-bin-ubuntu-x64.tar.gz'
    archive = 'prism_download.tmp'
    urllib.request.urlretrieve(url, archive)
    temp_dir = 'prism_temp_extract'
    os.makedirs(temp_dir, exist_ok=True)
    os.makedirs('llama-prism', exist_ok=True)
    try:
        with zipfile.ZipFile(archive, 'r') as z: z.extractall(temp_dir)
    except Exception:
        with tarfile.open(archive, 'r:*') as t: t.extractall(temp_dir)
    for root, dirs, files in os.walk(temp_dir):
        for f in files:
            src = os.path.join(root, f)
            dst = os.path.join('llama-prism', f)
            shutil.move(src, dst)
            try: os.chmod(dst, 0o755)
            except Exception: pass
    shutil.rmtree(temp_dir)
    if os.path.exists(archive): os.remove(archive)
    print('Prebuilt Linux binary extracted successfully.')
"''' }

