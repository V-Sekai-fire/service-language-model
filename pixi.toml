[workspace]
name = "strata-qwen38-flash"
version = "0.1.39"
description = "Zero-argument launcher for Strata v0.1.39 with dual 3090+4090 GPUs, durable caching, and auto-repaired BPE tokenizer"
channels = ["conda-forge", "nvidia"]
platforms = ["win-64", "linux-64"]

[dependencies]
python = "3.11.*"
regex = "*"
git = "*"
huggingface_hub = ">=0.28"
fastapi = "*"
uvicorn = "*"
requests = "*"

[target.win-64.dependencies]
cuda-toolkit = ">=12.4"

[target.linux-64.dependencies]
cuda-toolkit = ">=12.4"

[tasks]
default = { depends-on = ["serve"] }

dl-strata-repo = { cmd = '''python -c "
import os, urllib.request, zipfile, shutil, glob
if not os.path.exists('Strata-src'):
    print('Downloading Strata v0.1.39 release source archive...')
    url = 'https://github.com/Niko1221/Strata/archive/refs/tags/v0.1.39.zip'
    urllib.request.urlretrieve(url, 'strata_release.zip')
    temp_dir = 'strata_temp_src'
    os.makedirs(temp_dir, exist_ok=True)
    with zipfile.ZipFile('strata_release.zip', 'r') as z:
        z.extractall(temp_dir)
    extracted_folders = [f for f in glob.glob(os.path.join(temp_dir, '*')) if os.path.isdir(f)]
    if extracted_folders:
        shutil.move(extracted_folders[0], 'Strata-src')
    shutil.rmtree(temp_dir, ignore_errors=True)
    if os.path.exists('strata_release.zip'): os.remove('strata_release.zip')
    print('Strata v0.1.39 release source extracted to Strata-src.')
"''' }

dl-model = "hf download ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF --include 'IQ2_XS/*' --local-dir ./models"

dl-tokenizer = "hf download Qwen/Qwen3.8-27B --include 'vocab.json' --include 'merges.txt' --include 'tokenizer.json' --include 'tokenizer_config.json' --local-dir ./Strata-src/pack/full/tokenizer"

[target.win-64.tasks]
dl-engine = { cmd = '''python -c "
import os, urllib.request, zipfile
target = 'Strata-src/strata.exe'
if not os.path.exists(target):
    print('Fetching Strata v0.1.39 C++ engine binary...')
    url = 'https://github.com/Niko1221/Strata/releases/download/v0.1.39/strata-windows-x64-cuda12.zip'
    zpath = 'strata_engine.zip'
    urllib.request.urlretrieve(url, zpath)
    with zipfile.ZipFile(zpath, 'r') as z:
        z.extractall('Strata-src')
    if os.path.exists(zpath): os.remove(zpath)
    print('Strata C++ engine binary extracted to Strata-src.')
"''' }

serve = { depends-on = ["dl-strata-repo", "dl-model", "dl-tokenizer", "dl-engine"], cmd = '''python -c "
import os, json, secrets, subprocess, sys, glob, shutil

# Preserve/consolidate any shards previously downloaded into Strata-src/models
if os.path.exists('./Strata-src/models'):
    os.makedirs('./models', exist_ok=True)
    for root, dirs, files in os.walk('./Strata-src/models'):
        for f in files:
            if f.endswith('.gguf'):
                src = os.path.join(root, f)
                rel = os.path.relpath(src, './Strata-src/models')
                dst = os.path.join('./models', rel)
                os.makedirs(os.path.dirname(dst), exist_ok=True)
                if not os.path.exists(dst):
                    print(f'Preserving cached file: moving {f} to ./models')
                    shutil.move(src, dst)

env_file = '.env'
key = None
if os.path.exists(env_file):
    with open(env_file, 'r') as f:
        for line in f:
            if line.strip().startswith('STRATA_API_KEY='):
                key = line.strip().split('=', 1)[1].strip(' ' + chr(34) + chr(39))
                break
if not key:
    key = secrets.token_hex(16)
    with open(env_file, 'a') as f:
        f.write(f'STRATA_API_KEY={key}\n')

all_ggufs = glob.glob(r'./models/**/*.gguf', recursive=True)
shard1_files = [f for f in all_ggufs if '00001-of' in f or '00001.gguf' in f]
shard2_files = [f for f in all_ggufs if '00002-of' in f and '00001-of' not in f]

if not shard1_files and all_ggufs:
    shard1_files = [all_ggufs[0]]

if not shard1_files:
    sys.exit('Error: No GGUF model files found in ./models')

shard1_path = os.path.abspath(shard1_files[0])
shard2_path = os.path.abspath(shard2_files[0]) if shard2_files else None

s1_size_gb = os.path.getsize(shard1_path) / (1024**3)
print(f'Shard 1: {os.path.basename(shard1_path)} ({s1_size_gb:.2f} GB)')
if shard2_path:
    s2_size_gb = os.path.getsize(shard2_path) / (1024**3)
    print(f'Shard 2 (PLE): {os.path.basename(shard2_path)} ({s2_size_gb:.2f} GB)')

profile_path = os.path.abspath(r'./expert_profile.bin')
cache_dir = os.path.abspath(r'./strata_cache')
os.makedirs(cache_dir, exist_ok=True)

strata_exe = os.path.abspath(r'./Strata-src/strata.exe')
strata_cwd = os.path.abspath(r'./Strata-src')
tokenizer_dir = os.path.abspath(r'./Strata-src/pack/full/tokenizer')
os.makedirs(tokenizer_dir, exist_ok=True)

# Sanitize merges.txt binary buffer to eliminate trailing empty line crashes
merges_path = os.path.join(tokenizer_dir, 'merges.txt')
if os.path.exists(merges_path):
    with open(merges_path, 'rb') as f:
        raw = f.read()
    raw_clean = raw.rstrip(b'\r\n ')
    lines = raw_clean.split(b'\n')
    
    # Verify valid pair structure; re-fetch from HF if file was previously corrupted
    corrupted = False
    for idx, line in enumerate(lines):
        if idx == 0 and line.startswith(b'#'):
            continue
        if len(line.split(b' ')) != 2:
            corrupted = True
            break
            
    if corrupted:
        print('Detected corrupted merges.txt; re-downloading pristine version from HF...')
        from huggingface_hub import hf_hub_download
        hf_hub_download(repo_id='Qwen/Qwen3.8-27B', filename='merges.txt', local_dir=tokenizer_dir, force_download=True)
        with open(merges_path, 'rb') as f:
            raw_clean = f.read().rstrip(b'\r\n ')
        lines = raw_clean.split(b'\n')
        
    with open(merges_path, 'wb') as f:
        f.write(raw_clean)
    print(f'Sanitized merges.txt ({len(lines)} entries).')

token_type_path = os.path.join(tokenizer_dir, 'token_type.json')
if not os.path.exists(token_type_path):
    existing = glob.glob(r'./**/*token_type*.json', recursive=True)
    if existing:
        shutil.copy(existing[0], token_type_path)
        print(f'Copied token_type.json from {existing[0]}')
    else:
        with open(token_type_path, 'w', encoding='utf-8') as f:
            json.dump({}, f)
        print('Created fallback token_type.json in tokenizer folder')

engine_args = [
    '--native', shard1_path,
    '--expert-profile', profile_path,
    '--remote-expert-opt',
    '--prefill', 'auto',
    '--max-context', '262144'
]

if shard2_path:
    engine_args.extend(['--ple-gguf', shard2_path])

log_path = os.path.abspath(r'./Strata-src/strata_engine.log')

config_data = {
    'exe': strata_exe,
    'cwd': strata_cwd,
    'args': engine_args,
    'parallel': 4,
    'port': 9931,
    'host': '0.0.0.0',
    'api_key': key,
    'tokenizer': tokenizer_dir,
    'log': log_path
}

config_path = os.path.abspath(r'./Strata-src/strata-config.json')
with open(config_path, 'w', encoding='utf-8') as f:
    json.dump(config_data, f, indent=2)

print(f'Generated Strata configuration at: {config_path}')

os.chdir(strata_cwd)

cmd = [
    sys.executable,
    os.path.join('serve', 'server.py'),
    '--engine', 'strata',
    '--config', config_path,
    '--tokenizer', tokenizer_dir,
    '--host', '0.0.0.0',
    '--port', '9931',
    '--api-key', key
]

res = subprocess.call(cmd)
if res != 0:
    print('\n--- Strata Engine Error Log Output ---')
    logs = glob.glob('*.log')
    if logs:
        for lf in logs:
            print(f'=== Log File: {lf} ===')
            with open(lf, 'r', encoding='utf-8', errors='ignore') as f:
                lines = f.readlines()
                print(''.join(lines[-40:]))
    else:
        print('No log files found in Strata-src.')

sys.exit(res)
"''', env = { CUDA_VISIBLE_DEVICES = "0,1", STRATA_PF_FUSED = "1" } }

[target.linux-64.tasks]
dl-engine = { cmd = '''python -c "
import os, urllib.request, tarfile
target = 'Strata-src/strata'
if not os.path.exists(target):
    print('Fetching Strata v0.1.39 Linux engine binary...')
    url = 'https://github.com/Niko1221/Strata/releases/download/v0.1.39/strata-linux-x64-cuda12.tar.gz'
    archive = 'strata_engine.tar.gz'
    urllib.request.urlretrieve(url, archive)
    with tarfile.open(archive, 'r:*') as t:
        t.extractall('Strata-src')
    if os.path.exists(archive): os.remove(archive)
    print('Strata C++ engine binary extracted to Strata-src.')
"''' }

