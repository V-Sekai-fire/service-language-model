[workspace]
name = "strata-qwen38-flash"
version = "0.1.39"
description = "Zero-argument Strata v0.1.39 launcher for Qwen3.8-Flash-Next 2-bit with 4x parallel batching"
channels = ["conda-forge", "nvidia"]
platforms = ["win-64", "linux-64"]

[dependencies]
python = "3.11.*"
git = "*"
huggingface_hub = ">=0.28"

[target.win-64.dependencies]
cuda-toolkit = ">=12.4"

[target.linux-64.dependencies]
cuda-toolkit = ">=12.4"

[tasks]
default = { depends-on = ["serve"] }

# Downloads 2-bit GSQ-RCO IQ2_XS shards for Qwen3.8-Flash-Next
dl-model = "hf download ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF --include '*IQ2_XS*' --local-dir ./models"

[target.win-64.tasks]
dl-strata = { cmd = '''python -c "
import os, urllib.request, zipfile
target = 'strata-bin/strata.exe'
if not os.path.exists(target):
    print('Fetching Strata v0.1.39 binary...')
    url = 'https://github.com/Niko1221/Strata/releases/download/v0.1.39/strata-windows-x64-cuda12.zip'
    os.makedirs('strata-bin', exist_ok=True)
    zpath = 'strata_temp.zip'
    urllib.request.urlretrieve(url, zpath)
    with zipfile.ZipFile(zpath, 'r') as z:
        z.extractall('strata-bin')
    if os.path.exists(zpath): os.remove(zpath)
    print('Strata v0.1.39 binary extracted successfully.')
"''' }

serve = { depends-on = ["dl-model", "dl-strata"], cmd = '''python -c "
import os, secrets, subprocess, sys, glob
env_file = '.env'
key = None
if os.path.exists(env_file):
    with open(env_file, 'r') as f:
        for line in f:
            if line.strip().startswith('STRATA_API_KEY='):
                key = line.strip().split('=', 1)[1].strip(' ' + chr(34) + chr(39))
                break
if not key:
    key = secrets.token_hex(16)
    with open(env_file, 'a') as f:
        f.write(f'STRATA_API_KEY={key}\n')
    print('Generated new STRATA_API_KEY in .env')
else:
    print('Loaded STRATA_API_KEY from .env')

# Locate first shard file
model_files = glob.glob(r'./models/*IQ2_XS*00001*.gguf') + glob.glob(r'./models/*IQ2_XS*.gguf')
if not model_files:
    sys.exit('Error: No Qwen3.8-Flash-Next IQ2_XS GGUF file found in ./models')

model_path = model_files[0]

cmd = [
    r'.\strata-bin\strata.exe',
    'serve',
    '--model', model_path,
    '--parallel', '4',
    '--layer-split', 'auto',
    '--cors-origins', '*',
    '--api-key', key,
    '--host', '0.0.0.0',
    '--port', '9931'
]
sys.exit(subprocess.call(cmd))
"''', env = { CUDA_VISIBLE_DEVICES = "0,1" } }

[target.linux-64.tasks]
dl-strata = { cmd = '''python -c "
import os, urllib.request, tarfile
target = 'strata-bin/strata'
if not os.path.exists(target):
    print('Fetching Strata v0.1.39 Linux release...')
    url = 'https://github.com/Niko1221/Strata/releases/download/v0.1.39/strata-linux-x64-cuda12.tar.gz'
    os.makedirs('strata-bin', exist_ok=True)
    archive = 'strata_temp.tar.gz'
    urllib.request.urlretrieve(url, archive)
    with tarfile.open(archive, 'r:*') as t:
        t.extractall('strata-bin')
    if os.path.exists(archive): os.remove(archive)
    print('Strata v0.1.39 binary extracted successfully.')
"''' }

serve = { depends-on = ["dl-model", "dl-strata"], cmd = '''python -c "
import os, secrets, subprocess, sys, glob
env_file = '.env'
key = None
if os.path.exists(env_file):
    with open(env_file, 'r') as f:
        for line in f:
            if line.strip().startswith('STRATA_API_KEY='):
                key = line.strip().split('=', 1)[1].strip(' ' + chr(34) + chr(39))
                break
if not key:
    key = secrets.token_hex(16)
    with open(env_file, 'a') as f:
        f.write(f'STRATA_API_KEY={key}\n')
    print('Generated new STRATA_API_KEY in .env')
else:
    print('Loaded STRATA_API_KEY from .env')

model_files = glob.glob('./models/*IQ2_XS*00001*.gguf') + glob.glob('./models/*IQ2_XS*.gguf')
if not model_files:
    sys.exit('Error: No Qwen3.8-Flash-Next IQ2_XS GGUF file found in ./models')

model_path = model_files[0]

cmd = [
    './strata-bin/strata',
    'serve',
    '--model', model_path,
    '--parallel', '4',
    '--layer-split', 'auto',
    '--cors-origins', '*',
    '--api-key', key,
    '--host', '0.0.0.0',
    '--port', '9931'
]
sys.exit(subprocess.call(cmd))
"''', env = { CUDA_VISIBLE_DEVICES = "0,1" } }
