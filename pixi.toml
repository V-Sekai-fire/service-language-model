[workspace]
name = "bonsai-v2-auto"
version = "0.5.0"
description = "Zero-argument single-step launcher for Ternary-Bonsai-2-27B with DFlash2"
channels = ["conda-forge", "nvidia"]
platforms = ["win-64", "linux-64"]

[dependencies]
python = "3.11.*"
cuda-toolkit = ">=12.4"
git = "*"
huggingface_hub = ">=0.28"

[tasks]
default = { depends-on = ["serve"] }

dl-target = "hf download OS-Software/Ternary-Bonsai-2-27B-Uncensored-Heretic-v2-GGUF Ternary-Bonsai-2-27B-Uncensored-Heretic-v2-PQ2_0.gguf --local-dir ./models"
dl-draft = "hf download incoai/Qwen3.8-27B-DFlash2-GGUF Qwen3.8-27B-DFlash2-Q4_K_M.gguf --local-dir ./models"

[target.win-64.tasks]
dl-prism = { cmd = '''python -c "
import os, urllib.request, zipfile
target = 'llama-prism/llama-server.exe'
if not os.path.exists(target):
    print('Fetching Prism CUDA 13.3 binary and runtime DLLs...')
    urls = [
        'https://github.com/PrismML-Eng/llama.cpp/releases/download/prism-b10754-2459f68/llama-prism-b10754-2459f68-bin-win-cuda-13.3-x64.zip',
        'https://github.com/PrismML-Eng/llama.cpp/releases/download/prism-b10754-2459f68/cudart-llama-bin-win-cuda-13.3-x64.zip'
    ]
    os.makedirs('llama-prism', exist_ok=True)
    for idx, url in enumerate(urls):
        zpath = f'prism_temp_{idx}.zip'
        urllib.request.urlretrieve(url, zpath)
        with zipfile.ZipFile(zpath, 'r') as z:
            for item in z.infolist():
                fname = os.path.basename(item.filename)
                if fname:
                    open(os.path.join('llama-prism', fname), 'wb').write(z.open(item).read())
        if os.path.exists(zpath): os.remove(zpath)
    print('Extracted Prism binary and CUDA runtime DLLs successfully.')
"''' }

serve = { depends-on = ["dl-target", "dl-draft", "dl-prism"], cmd = ".\\llama-prism\\llama-server.exe -m .\\models\\Ternary-Bonsai-2-27B-Uncensored-Heretic-v2-PQ2_0.gguf -md .\\models\\Qwen3.8-27B-DFlash2-Q4_K_M.gguf --spec-type draft-dflash --spec-draft-n-max 3 -ngl 99 -ngld 99 -sm layer -c 256144 -ctk q4_0 -ctv q4_0 -np 1 -fa on --no-repack --repeat-penalty 1.0 --temp 0.65 --host 127.0.0.1 --port 8080", env = { CUDA_VISIBLE_DEVICES = "0,1" } }

[target.linux-64.tasks]
dl-prism = { cmd = "python -c \"import json, os, urllib.request, tarfile; tag='prism-b10754-2459f68'; target='llama-prism/llama-server'; (os.path.exists(target) or (print(f'Fetching prebuilt Prism CUDA binary ({tag})...'), urllib.request.urlretrieve(next((a['browser_download_url'] for a in json.loads(urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/PrismML-Eng/llama.cpp/releases/tags/{tag}', headers={'User-Agent': 'Mozilla/5.0'})).read().decode()).get('assets', []) if 'ubuntu' in a['name'].lower() or 'linux' in a['name'].lower()), f'https://github.com/PrismML-Eng/llama.cpp/releases/download/{tag}/llama-prism-{tag}-bin-ubuntu-x64.tar.gz'), 'prism.tar.gz'), os.makedirs('llama-prism', exist_ok=True), tarfile.open('prism.tar.gz').extractall('llama-prism'), print('Prebuilt binary extracted successfully.')))\"" }

serve = { depends-on = ["dl-target", "dl-draft", "dl-prism"], cmd = "./llama-prism/llama-server -m ./models/Ternary-Bonsai-2-27B-Uncensored-Heretic-v2-PQ2_0.gguf -md ./models/Qwen3.8-27B-DFlash2-Q4_K_M.gguf --spec-type draft-dflash --spec-draft-n-max 3 -ngl 99 -ngld 99 -sm layer -c 256144 -ctk q4_0 -ctv q4_0 -np 1 -fa on --no-repack --repeat-penalty 1.0 --temp 0.65 --host 127.0.0.1 --port 8080", env = { CUDA_VISIBLE_DEVICES = "0,1" } }